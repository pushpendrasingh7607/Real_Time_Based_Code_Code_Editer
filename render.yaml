services:
  - type: web
    name: codesync
    runtime: docker
    # Root Dockerfile builds React client + Node.js server in one container.
    # The server serves the built React app from /app/client/dist in production.
    dockerfilePath: ./Dockerfile
    envVars:
      - key: NODE_ENV
        value: production
      # PORT is auto-injected by Render — no need to set it here.
      # VITE_SERVER_URL is intentionally unset → same-origin mode (client served by same server).

