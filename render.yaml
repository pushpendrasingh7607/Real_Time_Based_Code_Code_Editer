services:
  - type: web
    name: codesync
    runtime: node
    # Builds the React client then installs server deps.
    # The server serves the built client from ../client/dist in production.
    buildCommand: "cd client && npm install && npm run build && cd ../server && npm install"
    startCommand: "node server/server.js"
    envVars:
      - key: NODE_ENV
        value: production
      - key: PORT
        value: 10000
      # VITE_SERVER_URL must be EMPTY for single-deploy (client + server same origin).
      # Render auto-sets RENDER_EXTERNAL_URL which the server uses for CORS.
      # No CLIENT_URL needed — same-origin deployment.
