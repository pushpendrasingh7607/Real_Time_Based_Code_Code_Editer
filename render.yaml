services:
  - type: web
    name: codesync
    runtime: node
    # rootDir is NOT set — we use the repo root so we can build client + server
    buildCommand: "cd client && npm install && npm run build && cd ../server && npm install"
    startCommand: "node server/server.js"
    envVars:
      - key: NODE_ENV
        value: production
      - key: PORT
        value: 10000
